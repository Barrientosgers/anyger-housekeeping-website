# Deploys the site to GitHub Pages (free).
#
# NOT LIVE YET: this workflow only runs when started by hand (workflow_dispatch).
# To publish automatically on every push to main, replace the "on:" block with:
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
#
# GitHub Pages must also be set to "GitHub Actions" in
# Settings -> Pages -> Build and deployment -> Source.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect only the files the website needs
        run: |
          mkdir _site
          cp -r index.html robots.txt sitemap.xml css js images fonts _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
